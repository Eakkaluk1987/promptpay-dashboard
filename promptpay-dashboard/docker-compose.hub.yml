# docker-compose.hub.yml
# Use this file to run from pre-built images on Docker Hub (no source code needed)
#
# Usage:
#   DOCKER_USERNAME=yourname docker compose -f docker-compose.hub.yml up
#
# Requirements on target machine:
#   - Docker Desktop installed
#   - data/ folder with CSV files placed at ../data/ relative to this file

services:
  backend:
    image: ${DOCKER_USERNAME:-eakkaluk1987}/promptpay-backend:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
    environment:
      - DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ${DOCKER_USERNAME:-eakkaluk1987}/promptpay-frontend:${IMAGE_TAG:-latest}
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped
