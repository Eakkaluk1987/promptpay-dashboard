services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${DOCKER_USERNAME:-local}/promptpay-backend:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
    environment:
      - DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-local}/promptpay-frontend:${IMAGE_TAG:-latest}
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped
